# The interpretation, as data. A performance = corpus commit + this file +
# compiler version. Per-piece sections are the exception log: every override
# carries its why.

[articulation]
base = 0.78       # détaché: the default speech of a baroque line
staccato = 0.40
tenuto = 0.95
legato = 1.00
repeated = 0.45   # MEASURED (note-level ASAP, 2026-09-01): humans cut
                  # repeated notes to 0.43 of the IOI against 0.86 for
                  # détaché — a far deeper relative separation than the
                  # 0.60 hand value (vel_fit --measure; contrast readout,
                  # pedal-safe)
cantabile = 0.90  # stepwise motion at singing values leans legato
min_gate = 0.10

[agogics]
# rit + opening fitted against 166 ASAP human performances of the WTC
# (asap_eval --fit-defaults, 2026-08-31): coordinate descent on Book I,
# Book II held out. Test r 0.234 -> 0.558; grand mean 0.333 -> 0.578.
rit_span = 2.0      # FITTED (was 1.0): humans slow -21% over the final
                    # two bars (residual mining, t = -14.1)
rit_floor = 0.3     # FITTED (was 0.6): the deep ending humans take
rit_curve = 2       # Friberg–Sundberg q: 2 = stopping-runner braking curve
tempo_step = 0.125  # curve granularity (eighth notes): smooth, not steppy
fermata_hold = 1.75
open_push = 0.06    # DISCOVERED + FITTED: settling in — humans open +5%
                    # above their own mean (t = 10.6); decays over open_span
open_span = 4.0
cadence_depth = 0.0 # mined marginal effect was confounded (joint model
                    # -3.4%, mostly shared with breath/bar-final); the fit
                    # switched it off on held-out evidence, and the
                    # structural/passing stratification + kinematic shape
                    # did not revive it (refit 2026-09-01)
boundary_ease = 0.0 # the deep boundary holds are real in the residuals,
                    # but neither a linear easing (2026-08-31) nor the
                    # Friberg-Sundberg kinematic brake (refit 2026-09-01,
                    # no train gain at any depth) is how humans do them —
                    # the shape is still not found
subject_push = 0.0  # +0.9% joint did not survive fitting

[phrasing]
# KTH Punctuation via Quantz's placement rules: breathe at rests, after
# long notes, at leaps — never mid-step. Per-lane micropauses only;
# tempo stays global (Harnoncourt: polyphony breathes per voice).
breath_threshold = 1.0
breath = 0.25       # fraction of the note's sounding length given to air
w_gap = 1.2         # written rest after the note (strongest signal)
w_dur = 0.7         # long note arriving after shorter ones
w_leap = 0.5        # leap away from the note

[dynamics]
# NOTE-LEVEL FIT (vel_fit --fit-defaults vs 166 ASAP performances,
# 2026-09-01): held-out Book II velocity r 0.161 -> 0.421. Register is
# what humans actually voice by — vel_highloud triples and dominates;
# read the zeros below with that in mind: rules whose contribution is
# invisible beside register got switched off, not disproven at zero
# register-contrast. All remain per-piece knobs.
vel_base = 84       # centre velocity (unfittable: r is affine-invariant)
vel_bar = 0         # FITTED (was 12): Sloboda's barline accent does not
vel_halfbar = 0     # survive contact with WTC velocities...
vel_beat = 3        # ...but the beat level does, exactly at its hand value
vel_arch = 0        # FITTED (was 8): no Todd loudness arch in the keys
vel_highloud = 0.8  # FITTED (was 0.25): the dominant driver — melodic
                    # height IS the human loudness map here
vel_accent = 14     # kern ^ marks: the score's own emphasis (too rare
                    # in the WTC to fit)
# NB: velocity lands on the A4 and BS2; the Model D ignores it (CV + hands)

[ornaments]
trill_rate = 12   # trill subnotes per second — C.P.E. Bach ties rate to
                  # tempo and affect; 10–14 covers keyboard practice
grace_ms = 70     # short Vorschlag length: on the beat, stolen from the
                  # main note (C.P.E. Bach, Versuch I.2)
grace_long = 0    # 1 = single graces become long appoggiaturas (half the
                  # main note, 2/3 of a dotted one — Versuch I.2 §11); a
                  # per-piece stylistic decision, so off in the base

[tuning]
bend_range = 2    # receiver's pitch-bend range in ± semitones. 2 is the
                  # power-on default nearly everywhere; MUST match what the
                  # A4 / Model D / BS2 are configured for, or the
                  # temperament lands scaled wrong.

[interpretation]
# The two master knobs (Director Musices architecture: rule quantities
# scaled by family multipliers). 0 = mechanical, 1 = literature defaults.
expression = 1.0  # dissonance emphasis, phrase arches, agogic leans
ensemble = 1.0    # melody lead, chord roll, seeded micro-jitter

[dissonance]
dis_vel = 0       # CPE Bach 1753's dissonances-louder — FITTED to 0
                  # (note-level 2026-09-01): no velocity trace in the
                  # human keys beside register (was 10; per-piece knob;
                  # the agogic lean dis_lean is separate and stands)
dis_lean = 0.10   # ...and leaned on: gate boost toward legato per charge
sus_soft = 0      # a suspension's RESOLUTION arriving gently — not
                  # found in the human keys (note-level fit 2026-09-01;
                  # was 4, remains a per-piece knob)
sus_lean = 0.0    # tempo lean into the dissonant moment — VETOED by the
                  # fit (2026-09-01: off beats 0.02 on train AND held-out
                  # r); the suspension's legato hold and gentle resolution
                  # stand, but humans do not bend the beat for it

[arches]
arch_piece = 0.024 # FITTED (was 0.03): Todd 1992 piece arch, at the depth
arch_group = 0.004 # the humans actually take (group arches nearly off —
                   # boundaries, not arches, carry human tempo shape)
arch_bars = 4

[performance]
lead_ms = 2       # MEASURED (note-level ASAP, 2026-09-01): in WTC
                  # counterpoint the top voice leads by only ~2 ms
                  # (median -2.1, IQR -10..+7, n=47230). Palmer 1996's
                  # 20-30 ms is melody-over-accompaniment texture, not
                  # polyphony — the voices are near-synchronous here
roll_ms = 12      # final chord rolled bass-upward, per note
jitter_ms = 3     # KTH noise rules — seeded by piece name: deterministic
jitter_vel = 2
dialogue_vel = 2   # FITTED (was 4): the floor-holder's presence survives
                   # the note-level fit at half strength
dialogue_yield = 0 # FITTED (was 2): the listeners' yielding does not —
                   # not measurable beside register (per-piece knob)
seq_echo = 0      # FITTED (was 2): no terraced echo in the human keys
subject_vel = 5   # FITTED: survives exactly at its hand value — fugue
                  # subjects really are voiced up
mel_charge = 0    # FITTED (was 0.4): Friberg's melodic charge, no
harm_charge = 0   # FITTED (was 0.3): ...and harmonic charge — neither
                  # survives beside register (per-piece knobs)

[piece.wtc1p01]
base = 0.85       # pure arpeggiated figuration: let it ring toward pedal
overhold = 0.9    # finger pedal a la Czerny: the arpeggios bloom to the bar

[piece.wtc1p05]
inegal = 0.18     # audition: French-style D major sixteenths, gently swung
                  # (Quantz XI says yes, Neumann says not for Bach — ears decide)
