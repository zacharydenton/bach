<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>The Well-Tempered Clavier</title>
<link href="https://fonts.googleapis.com/css?family=Audiowide|Source+Sans+Pro:400,700,400italic" rel="stylesheet">
<link rel="stylesheet" href="app.css?v=8">
</head>
<body>
<div class="paper">
<header>
 <h1><span id="title">&hellip;</span><span class="idx" id="idx"></span></h1>
 <div class="row seekrow">
  <button id="start" class="primary">&#9654; Start</button>
  <button id="play" hidden>Pause</button>
  <span class="railwrap">
   <div class="rail" id="rail" role="slider" aria-label="position" tabindex="0"
        aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
     <div class="fill" id="fill"></div>
   </div>
   <div class="times"><span id="tnow">0:00</span><span id="tlen">0:00</span></div>
  </span>
 </div>
 <div class="row">
  <button id="prev" aria-label="previous piece">&#9198;</button>
  <select id="piecesel"></select>
  <button id="next" aria-label="next piece">&#9197;</button>
 </div>
</header>
<div id="parts"></div>
<section class="ledger">
 <span class="eyebrow">Interpretation</span>
 <div id="whys" aria-live="polite"></div>
</section>
<div class="stats" id="stats">engine not started</div>

</div>
<script type="module" src="app.js?v=4"></script>
</body>
</html>
